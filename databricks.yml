# Databricks Asset Bundle configuration for the Uber Eats Marketplace Lakehouse.
# The same bundle deploys to dev or prod; CI/CD drives it with DATABRICKS_HOST /
# DATABRICKS_TOKEN environment variables (host cannot use variable interpolation).

bundle:
  name: uber_eats_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name for this environment
    default: uber_eats_lakehouse

targets:
  dev:
    mode: development
    default: true
    variables:
      # Free Edition has a single catalog, so dev points at it. Development
      # mode still prefixes job names, so dev jobs never collide with prod's.
      catalog: uber_eats_lakehouse

  prod:
    mode: production
    variables:
      catalog: uber_eats_lakehouse
    run_as:
      user_name: ${workspace.current_user.userName}
